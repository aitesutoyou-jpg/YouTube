<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YouTube音声プレイヤー</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" />
<style>
  :root {
    --paper:#EAE6D9; --ink:#23282B; --card:#F5F1E6; --panel:#141618;
    --oxblood:#7A2E2E; --brass:#A6862C; --sage:#7c9169; --muted:#9a917d; --line:#33302a;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'IBM Plex Sans', sans-serif; background:#000; color:var(--paper); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 24px 24px 48px; }

  .urlbox { margin-top:24px; background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:16px 20px; }
  .urlbox strong { font-family:'Fraunces', serif; font-size:16px; color:var(--paper); }
  .urlbox p { font-size:13px; color:var(--muted); margin:6px 0 12px; line-height:1.5; }
  .urlform { display:flex; gap:8px; flex-wrap:wrap; }
  .urlform input { flex:1; min-width:180px; padding:9px 12px; border:1px solid var(--line); border-radius:3px; font-size:13px; background:#0c0d0e; color:var(--paper); }
  .btn { border:none; border-radius:3px; font-weight:600; cursor:pointer; font-family:'IBM Plex Sans', sans-serif; }
  .btn-ox { background:var(--oxblood); color:var(--card); padding:9px 16px; font-size:13px; display:flex; align-items:center; gap:6px; }
  .autoplaylabel { display:flex; align-items:center; gap:6px; font-size:12.5px; font-family:'IBM Plex Mono', monospace; color:var(--sage); cursor:pointer; user-select:none; margin-top:10px; }

  .errbox { margin-top:14px; display:flex; gap:8px; align-items:flex-start; background:#2a1614; border:1px solid var(--oxblood); border-radius:3px; padding:10px 12px; font-size:13px; color:#e2a89c; }
  .errbox.info { background:#2a2413; border-color:var(--brass); color:#d8bd7e; }

  /* compact now-playing bar */
  .nowplaying-full {
    min-height:100vh; min-height:100svh; width:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:20px; padding:32px 20px 60px; text-align:center; position:relative;
  }
  .np-thumb-big { width:110px; height:110px; object-fit:cover; border-radius:8px; background:#141618; box-shadow:0 8px 24px rgba(0,0,0,0.5); }
  .np-text-big { max-width:min(90vw, 420px); }
  .np-title-c { font-family:'Fraunces', serif; font-size:19px; font-weight:600; color:var(--paper); line-height:1.35; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .np-channel-c { font-size:13px; color:#a89f8a; margin-top:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .np-seekrow-big { display:flex; align-items:center; gap:10px; width:100%; max-width:420px; }
  .np-time { font-family:'IBM Plex Mono', monospace; font-size:11px; color:#a89f8a; width:36px; flex-shrink:0; }
  .np-time:last-child { text-align:right; }
  .np-seekbar { flex:1; -webkit-appearance:none; appearance:none; height:5px; border-radius:3px; background:#4a5058; outline:none; margin:0; }
  .np-seekbar::-webkit-slider-thumb { -webkit-appearance:none; appearance:none; width:17px; height:17px; border-radius:50%; background:var(--brass); cursor:pointer; }
  .np-seekbar::-moz-range-thumb { width:17px; height:17px; border-radius:50%; background:var(--brass); border:none; cursor:pointer; }
  .np-row3 { display:flex; align-items:center; justify-content:center; gap:18px; }
  .np-icon-btn { background:transparent; border:1px solid #4a5058; color:var(--paper); border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; font-family:'IBM Plex Mono', monospace; font-size:17px; flex-shrink:0; }
  .np-icon-btn.active { background:var(--brass); border-color:var(--brass); color:#23282B; }
  .np-btn-lg { width:76px; height:76px; }
  .np-btn-accent { background:var(--oxblood); border-color:var(--oxblood); }
  .np-skip-label { position:absolute; bottom:10px; font-family:'IBM Plex Mono', monospace; font-size:10px; font-weight:600; }
  .np-scrolldown { position:absolute; bottom:14px; left:50%; transform:translateX(-50%); background:transparent; border:none; color:#7a7568; font-family:'IBM Plex Mono', monospace; font-size:11px; display:flex; align-items:center; gap:4px; cursor:pointer; padding:6px 10px; }

  .yt-hidden-host { width:2px; height:2px; overflow:hidden; position:absolute; opacity:0.01; pointer-events:none; }

  .queue-row { display:flex; align-items:center; gap:8px; border-radius:3px; padding:6px 8px; }

  .lock-overlay {
    position:fixed; inset:0; background:#000; z-index:1000;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px; color:var(--brass); cursor:pointer;
    touch-action:none; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none;
  }
  .lock-hint { font-family:'IBM Plex Mono', monospace; font-size:12px; text-align:center; line-height:1.7; color:#8a8478; }
  .lock-progress { width:120px; height:3px; background:#1a1a17; border-radius:2px; overflow:hidden; }
  .lock-progress-fill { width:0%; height:100%; background:var(--brass); }
  .lock-overlay.holding .lock-progress-fill { width:100%; transition:width 3s linear; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <div id="nowplaying-slot"></div>
  <div id="error-slot"></div>
  <div id="directurl-slot"></div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
/* ---------- state ---------- */
const state = {
  error: "",
  errorType: "",
  nowPlaying: null,
  urlQueue: [],
  autoPlayNext: true,
  wakeLockOn: false,
  playbackRate: 1,
};
const SPEED_STEPS = [1, 1.25, 1.5, 1.75, 2];

/* ---------- persistence (localStorage) ----------
   Keeps the playlist across app closes / reloads. Wrapped in try/catch
   because localStorage can be unavailable (e.g. some sandboxed previews,
   or Safari private browsing) — in that case the app just falls back to
   an in-memory list for the current session, same as before. */
const STORAGE_KEY = "cc-archive-queue-v1";
const AUTOPLAY_KEY = "cc-archive-autoplay-v1";
let storageAvailable = true;

function saveQueue() {
  if (!storageAvailable) return;
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.urlQueue));
    localStorage.setItem(AUTOPLAY_KEY, JSON.stringify(state.autoPlayNext));
  } catch (e) {
    storageAvailable = false;
    console.warn("localStorageに保存できませんでした。このセッション内のみ保持されます。", e);
  }
}
function loadQueue() {
  try {
    const q = localStorage.getItem(STORAGE_KEY);
    const a = localStorage.getItem(AUTOPLAY_KEY);
    if (q) state.urlQueue = JSON.parse(q);
    if (a !== null) state.autoPlayNext = JSON.parse(a);
  } catch (e) {
    storageAvailable = false;
    console.warn("localStorageから復元できませんでした。", e);
  }
}
loadQueue();

let ytApiReady = false;
let ytPlayer = null;
let pendingVideoToMount = null;
window.onYouTubeIframeAPIReady = function () {
  ytApiReady = true;
  const btn = document.getElementById("np-playpause");
  if (btn) btn.disabled = false;
  if (pendingVideoToMount) {
    const v = pendingVideoToMount;
    pendingVideoToMount = null;
    mountPlayer(v);
  } else if (state.nowPlaying) {
    mountPlayer(state.nowPlaying);
  }
};
// If the YouTube iframe API script fails to load or is blocked (network
// restrictions, an ad/tracker blocker, etc.), onYouTubeIframeAPIReady above
// never fires and playback silently can't start. Detect that and tell the
// user instead of leaving the play button looking broken.
setTimeout(() => {
  if (!ytApiReady) {
    state.error = "YouTubeプレイヤーの読み込みに失敗しました。通信状況や広告ブロッカーの設定を確認し、ページを再読み込みしてください。";
    state.errorType = "error";
    renderError();
  }
}, 7000);

/* ---------- helpers ---------- */
function el(html) { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstChild; }
function icon(name, size = 14, extra = "") {
  const paths = {
    plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
    x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
    play: '<polygon points="5 3 19 12 5 21 5 3" fill="currentColor"/>',
    pause: '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>',
    alert: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
    moon: '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>',
    eye: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
    skipback: '<polygon points="19 20 9 12 19 4 19 20" fill="currentColor"/><line x1="5" y1="19" x2="5" y2="5"/>',
    skipforward: '<polygon points="5 4 15 12 5 20 5 4" fill="currentColor"/><line x1="19" y1="5" x2="19" y2="19"/>',
    lock: '<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
    loader: '<line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/>',
    rewind: '<polygon points="11 19 2 12 11 5 11 19" fill="currentColor"/><polygon points="22 19 13 12 22 5 22 19" fill="currentColor"/>',
    fastforward: '<polygon points="13 19 22 12 13 5 13 19" fill="currentColor"/><polygon points="2 19 11 12 2 5 2 19" fill="currentColor"/>',
  };
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="${extra}">${paths[name] || ""}</svg>`;
}

/* ---------- error ---------- */
function renderError() {
  const slot = document.getElementById("error-slot");
  slot.innerHTML = "";
  if (!state.error) return;
  const cls = state.errorType === "info" ? "errbox info" : "errbox";
  slot.appendChild(el(`<div class="${cls}">${icon("alert",16)}<span>${state.error}</span></div>`));
}

/* ---------- direct URL / video ID playback (no API key needed) ---------- */
function extractVideoId(input) {
  input = input.trim();
  if (/^[a-zA-Z0-9_-]{11}$/.test(input)) return input; // bare video ID
  const patterns = [
    /(?:youtube\.com\/watch\?.*v=|youtube\.com\/shorts\/|youtube\.com\/embed\/|youtu\.be\/)([a-zA-Z0-9_-]{11})/,
  ];
  for (const re of patterns) {
    const m = input.match(re);
    if (m) return m[1];
  }
  return null;
}

function makePlaceholderVideo(id) {
  return { id, title: "読み込み中…", channel: "", thumb: `https://i.ytimg.com/vi/${id}/mqdefault.jpg` };
}

// Fetches the title/author from oEmbed (no API key needed) and patches it
// into whichever queue entry / now-playing panel already reference this
// video id — this runs *after* playback has already started, so a slow or
// blocked network request never delays the actual play() call.
async function enrichVideoMeta(id) {
  try {
    const res = await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent("https://www.youtube.com/watch?v=" + id)}&format=json`);
    if (!res.ok) return;
    const data = await res.json();
    const patch = { title: data.title, channel: data.author_name || "", thumb: data.thumbnail_url };
    const q = state.urlQueue.find((v) => v.id === id);
    if (q) Object.assign(q, patch);
    if (state.nowPlaying?.id === id) Object.assign(state.nowPlaying, patch);
    saveQueue();
    renderQueueList();
    const titleEl = document.querySelector(".np-title-c");
    const channelEl = document.querySelector(".np-channel-c");
    const thumbEl = document.querySelector(".np-thumb-big");
    if (state.nowPlaying?.id === id) {
      if (titleEl) titleEl.textContent = patch.title;
      if (channelEl) channelEl.textContent = patch.channel;
      if (thumbEl && patch.thumb) thumbEl.src = patch.thumb;
    }
  } catch (err) {
    console.warn("oEmbed取得に失敗(再生自体は継続しています):", err);
  }
}

function addToQueue(video) {
  if (state.urlQueue.some((v) => v.id === video.id)) return;
  state.urlQueue.push(video);
  saveQueue();
  renderAll(); // just add to the list — don't start playback automatically
}
function removeFromQueue(id) {
  state.urlQueue = state.urlQueue.filter((v) => v.id !== id);
  saveQueue();
  if (state.nowPlaying?.id === id) { state.nowPlaying = null; destroyPlayer(); }
  renderAll();
}
function playNextInQueue() {
  const idx = state.urlQueue.findIndex((v) => v.id === state.nowPlaying?.id);
  if (idx >= 0 && idx + 1 < state.urlQueue.length) playVideo(state.urlQueue[idx + 1]);
}
function playPrevInQueue() {
  const idx = state.urlQueue.findIndex((v) => v.id === state.nowPlaying?.id);
  if (idx > 0) playVideo(state.urlQueue[idx - 1]);
}
function playVideo(v) { state.nowPlaying = v; syncNowPlaying(); renderAll(); }

function renderDirectUrlBox() {
  const slot = document.getElementById("directurl-slot");
  slot.innerHTML = "";
  const box = el(`
    <div class="urlbox">
      ${storageAvailable ? "" : '<p style="color:#7A2E2E; font-size:12.5px; margin:0 0 10px;">この環境では保存機能が使えないため、閉じるとリストは消えます。</p>'}
      <form class="urlform" id="urlform">
        <input type="text" id="urlinput" placeholder="https://www.youtube.com/watch?v=... または動画ID" />
        <button type="submit" class="btn btn-ox">${icon("plus",15)} 追加</button>
      </form>
      <label class="autoplaylabel">
        <input type="checkbox" id="autoplaynext" ${state.autoPlayNext ? "checked" : ""} /> 連続再生する(次の動画へ自動で進む)
      </label>
      <div id="queue-list"></div>
    </div>
  `);
  slot.appendChild(box);
  document.getElementById("urlform").addEventListener("submit", (e) => {
    e.preventDefault();
    const raw = document.getElementById("urlinput").value;
    const id = extractVideoId(raw);
    if (!id) {
      state.error = "有効なYouTubeのURLまたは動画IDを入力してください。";
      state.errorType = "error";
      renderError();
      return;
    }
    document.getElementById("urlinput").value = "";
    state.error = "";
    renderError();
    // Play immediately, synchronously within this click/submit handler, so
    // the browser still recognizes it as a direct user gesture (important
    // for Android Chrome's autoplay-with-sound policy). Metadata catches up
    // afterwards without blocking playback.
    const video = makePlaceholderVideo(id);
    addToQueue(video);
    enrichVideoMeta(id);
  });
  document.getElementById("autoplaynext").addEventListener("change", (e) => {
    state.autoPlayNext = e.target.checked;
    saveQueue();
  });
  renderQueueList();
}

function renderQueueList() {
  const listEl = document.getElementById("queue-list");
  if (!listEl) return;
  listEl.innerHTML = "";
  if (state.urlQueue.length === 0) return;
  const wrap = el(`<div style="margin-top:12px; display:flex; flex-direction:column; gap:6px;"></div>`);
  state.urlQueue.forEach((v, i) => {
    const playing = state.nowPlaying?.id === v.id;
    const row = el(`
      <div class="queue-row" style="background:${playing ? "#2a2f33" : "#141618"}; color:#EAE6D9; border:1px solid ${playing ? "#5a6570" : "#33302a"};">
        <span style="font-family:'IBM Plex Mono', monospace; font-size:11px; color:${playing ? "#A6862C" : "#5b5648"}; width:18px;">${i + 1}</span>
        <img src="${v.thumb || ""}" alt="" style="width:44px; height:28px; object-fit:cover; border-radius:2px; flex-shrink:0;" />
        <span style="flex:1; font-size:12.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${v.title}${playing ? " · 再生中" : ""}</span>
        <button class="q-play" data-id="${v.id}" style="background:transparent; border:none; color:inherit; cursor:pointer; padding:4px;">${icon("play",14)}</button>
        <button class="q-remove" data-id="${v.id}" style="background:transparent; border:none; color:inherit; cursor:pointer; padding:4px;">${icon("x",14)}</button>
      </div>
    `);
    wrap.appendChild(row);
  });
  listEl.appendChild(wrap);
  listEl.querySelectorAll(".q-play").forEach((btn) => {
    btn.addEventListener("click", () => {
      const v = state.urlQueue.find((x) => x.id === btn.dataset.id);
      if (v) playVideo(v);
    });
  });
  listEl.querySelectorAll(".q-remove").forEach((btn) => {
    btn.addEventListener("click", () => removeFromQueue(btn.dataset.id));
  });
}

/* ---------- player ---------- */
let seekInterval = null;
function stopSeekInterval() { if (seekInterval) { clearInterval(seekInterval); seekInterval = null; } }
function destroyPlayer() { stopSeekInterval(); if (ytPlayer) { try { ytPlayer.destroy(); } catch (e) {} ytPlayer = null; } }

function formatTime(sec) {
  if (!sec && sec !== 0) return "0:00";
  sec = Math.floor(sec);
  const m = Math.floor(sec / 60), s = sec % 60;
  return `${m}:${String(s).padStart(2, "0")}`;
}

function startSeekInterval() {
  stopSeekInterval();
  seekInterval = setInterval(() => {
    if (!ytPlayer || seeking) return;
    const bar = document.getElementById("np-seek");
    const cur = document.getElementById("np-time-cur");
    const dur = document.getElementById("np-time-dur");
    if (!bar) return;
    try {
      const duration = ytPlayer.getDuration() || 0;
      const current = ytPlayer.getCurrentTime() || 0;
      bar.max = duration || 0;
      bar.value = current;
      if (cur) cur.textContent = formatTime(current);
      if (dur) dur.textContent = formatTime(duration);
    } catch (e) { /* player not ready yet */ }
  }, 500);
}
let seeking = false;

function mountPlayer(video) {
  if (!ytApiReady) {
    pendingVideoToMount = video;
    const btn = document.getElementById("np-playpause");
    if (btn) { btn.disabled = true; btn.innerHTML = icon("loader", 32, "animation: spin 1s linear infinite;"); }
    return;
  }
  // Reuse the existing player/iframe when possible: recreating a fresh
  // iframe on every track change loses the "autoplay allowed" permission
  // the browser granted at the original user gesture, which silently
  // blocked auto-advance to the next track. loadVideoById() keeps the same
  // iframe alive and just swaps the video.
  if (ytPlayer && typeof ytPlayer.loadVideoById === "function") {
    try {
      stopSeekInterval();
      ytPlayer.loadVideoById(video.id);
      ytPlayer.setPlaybackRate(state.playbackRate);
      startSeekInterval();
      setupMediaSession(video);
      return;
    } catch (e) {
      console.warn("既存プレイヤーの再利用に失敗、再生成します:", e);
    }
  }
  destroyPlayer();
  const host = document.getElementById("yt-host");
  if (!host) return;
  ytPlayer = new YT.Player(host, {
    videoId: video.id,
    width: "2", height: "2",
    playerVars: { autoplay: 1, playsinline: 1, controls: 0, vq: "tiny" },
    events: {
      onReady: (e) => {
        e.target.setPlaybackQuality("tiny");
        e.target.setPlaybackRate(state.playbackRate);
        e.target.playVideo();
        startSeekInterval();
      },
      onStateChange: (e) => {
        const S = YT.PlayerState;
        if (e.data === S.PLAYING) e.target.setPlaybackQuality("tiny");
        if ("mediaSession" in navigator) {
          navigator.mediaSession.playbackState = e.data === S.PLAYING ? "playing" : e.data === S.PAUSED ? "paused" : "none";
        }
        updatePlayPauseIcon(e.data === S.PLAYING);
        if (e.data === S.ENDED) { stopSeekInterval(); if (state.autoPlayNext) playNextInQueue(); }
      },
      onPlaybackQualityChange: (e) => { if (e.data !== "tiny" && e.data !== "small") e.target.setPlaybackQuality("tiny"); },
      onPlaybackRateChange: (e) => {
        state.playbackRate = e.data;
        const btn = document.getElementById("np-speed");
        if (btn) btn.textContent = `${e.data}x`;
      },
    },
  });
  setupMediaSession(video);
}

function setupMediaSession(video) {
  if (!("mediaSession" in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: video.title, artist: video.channel, album: "パブリック・アーカイブ",
    artwork: video.thumb ? [{ src: video.thumb, sizes: "320x180", type: "image/jpeg" }] : [],
  });
  navigator.mediaSession.setActionHandler("play", () => ytPlayer?.playVideo?.());
  navigator.mediaSession.setActionHandler("pause", () => ytPlayer?.pauseVideo?.());
}

function updatePlayPauseIcon(isPlaying) {
  const btn = document.getElementById("np-playpause");
  if (btn) btn.innerHTML = isPlaying ? icon("pause", 32) : icon("play", 32);
}

/* ---------- Wake Lock: keep the screen on so playback doesn't get
   suspended by the OS turning the display off. Does NOT survive the
   tab/app being closed — only prevents auto screen-off while open. ---------- */
let wakeLockSentinel = null;
async function enableWakeLock() {
  if (!("wakeLock" in navigator)) {
    state.error = "この端末・ブラウザはWake Lock APIに対応していないため、画面オンの維持はできません。";
    state.errorType = "info";
    renderError();
    return false;
  }
  try {
    wakeLockSentinel = await navigator.wakeLock.request("screen");
    wakeLockSentinel.addEventListener("release", () => { wakeLockSentinel = null; });
    return true;
  } catch (err) {
    console.warn("Wake Lock取得に失敗:", err);
    return false;
  }
}
function disableWakeLock() {
  if (wakeLockSentinel) { wakeLockSentinel.release().catch(() => {}); wakeLockSentinel = null; }
}
document.addEventListener("visibilitychange", async () => {
  if (state.wakeLockOn && document.visibilityState === "visible" && !wakeLockSentinel) {
    await enableWakeLock();
  }
});

// Full-screen lock overlay: blocks taps to the rest of the page (e.g. while
// the phone is in a pocket/bag) so buttons don't get pressed by accident.
// Exiting requires a 3-second press-and-hold. Playback keeps running behind
// this — it only intercepts touches, it doesn't touch the player.
function showLockOverlay() {
  const HOLD_MS = 3000;
  let holdTimer = null;
  const overlay = el(`
    <div class="lock-overlay" id="lock-overlay">
      ${icon("lock", 28)}
      <div class="lock-hint">誤作動防止中<br/>3秒間 長押しして解除</div>
      <div class="lock-progress"><div class="lock-progress-fill" id="lock-progress-fill"></div></div>
    </div>
  `);
  document.body.appendChild(overlay);

  const startHold = (e) => {
    if (e.cancelable) e.preventDefault();
    if (holdTimer) return;
    overlay.classList.add("holding");
    holdTimer = setTimeout(() => overlay.remove(), HOLD_MS);
  };
  const cancelHold = () => {
    clearTimeout(holdTimer);
    holdTimer = null;
    overlay.classList.remove("holding");
  };
  overlay.addEventListener("pointerdown", startHold);
  overlay.addEventListener("pointerup", cancelHold);
  overlay.addEventListener("pointerleave", cancelHold);
  overlay.addEventListener("pointercancel", cancelHold);
  overlay.addEventListener("touchstart", startHold, { passive: false });
  overlay.addEventListener("touchend", cancelHold);
  overlay.addEventListener("touchcancel", cancelHold);
  overlay.addEventListener("mousedown", startHold);
  overlay.addEventListener("mouseup", cancelHold);
  overlay.addEventListener("mouseleave", cancelHold);
}

/* ---------- now playing (fullscreen) ---------- */
let renderedNowPlayingId = null;

function buildNowPlayingPanel(v) {
  const slot = document.getElementById("nowplaying-slot");
  slot.innerHTML = "";
  const panel = el(`
    <div class="nowplaying-full">
      <div class="np-text-big">
        <div class="np-title-c">${v.title}</div>
        <div class="np-channel-c">${v.channel || ""}</div>
      </div>
      <img class="np-thumb-big" src="${v.thumb || ""}" alt="" />
      <div class="np-seekrow-big">
        <span class="np-time" id="np-time-cur">0:00</span>
        <input type="range" id="np-seek" class="np-seekbar" min="0" max="100" value="0" step="1" />
        <span class="np-time" id="np-time-dur">0:00</span>
      </div>
      <div class="np-row3">
        <button id="np-back30" class="np-icon-btn np-btn-lg" title="30秒戻る">${icon("rewind",24)}<span class="np-skip-label">30</span></button>
        <button id="np-back10" class="np-icon-btn np-btn-lg" title="10秒戻る">${icon("rewind",24)}<span class="np-skip-label">10</span></button>
        <button id="np-fwd30" class="np-icon-btn np-btn-lg" title="30秒進む">${icon("fastforward",24)}<span class="np-skip-label">30</span></button>
      </div>
      <div class="np-row3">
        <button id="np-prev" class="np-icon-btn np-btn-lg" title="前の動画">${icon("skipback",28)}</button>
        <button id="np-playpause" class="np-icon-btn np-btn-lg np-btn-accent" title="再生/一時停止">${icon("pause",32)}</button>
        <button id="np-next" class="np-icon-btn np-btn-lg" title="次の動画">${icon("skipforward",28)}</button>
      </div>
      <div class="np-row3">
        <button id="np-speed" class="np-icon-btn np-btn-lg" title="再生速度">${state.playbackRate}x</button>
        <button id="np-wakelock" class="np-icon-btn np-btn-lg ${state.wakeLockOn ? "active" : ""}" title="画面オン維持">${icon("eye",28)}</button>
        <button id="np-lock" class="np-icon-btn np-btn-lg" title="誤作動防止(ロック)">${icon("lock",28)}</button>
      </div>
      <button id="np-scrolldown" class="np-scrolldown" title="リストを見る">${icon("skipback",16,"transform:rotate(-90deg);")} リスト</button>
      <div class="yt-hidden-host" id="yt-host"></div>
    </div>
  `);
  slot.appendChild(panel);
  document.getElementById("np-playpause").addEventListener("click", () => {
    if (!ytPlayer) return;
    const s = ytPlayer.getPlayerState();
    if (s === YT.PlayerState.PLAYING) { ytPlayer.pauseVideo(); updatePlayPauseIcon(false); }
    else { ytPlayer.playVideo(); updatePlayPauseIcon(true); }
  });
  document.getElementById("np-prev").addEventListener("click", () => playPrevInQueue());
  document.getElementById("np-next").addEventListener("click", () => playNextInQueue());
  document.getElementById("np-back30").addEventListener("click", () => seekBy(-30));
  document.getElementById("np-back10").addEventListener("click", () => seekBy(-10));
  document.getElementById("np-fwd30").addEventListener("click", () => seekBy(30));
  const seekBar = document.getElementById("np-seek");
  seekBar.addEventListener("input", () => {
    seeking = true;
    const cur = document.getElementById("np-time-cur");
    if (cur) cur.textContent = formatTime(seekBar.value);
  });
  seekBar.addEventListener("change", () => {
    if (ytPlayer) ytPlayer.seekTo(Number(seekBar.value), true);
    seeking = false;
  });
  document.getElementById("np-speed").addEventListener("click", () => {
    const idx = SPEED_STEPS.indexOf(state.playbackRate);
    const next = SPEED_STEPS[(idx + 1) % SPEED_STEPS.length];
    state.playbackRate = next;
    ytPlayer?.setPlaybackRate?.(next);
    document.getElementById("np-speed").textContent = `${next}x`;
  });
  document.getElementById("np-wakelock").addEventListener("click", async () => {
    if (state.wakeLockOn) { disableWakeLock(); state.wakeLockOn = false; }
    else { state.wakeLockOn = await enableWakeLock(); }
    document.getElementById("np-wakelock").classList.toggle("active", state.wakeLockOn);
  });
  document.getElementById("np-lock").addEventListener("click", () => showLockOverlay());
  document.getElementById("np-scrolldown").addEventListener("click", () => {
    document.getElementById("directurl-slot").scrollIntoView({ behavior: "smooth" });
  });
}

function seekBy(deltaSec) {
  if (!ytPlayer) return;
  try {
    const dur = ytPlayer.getDuration() || 0;
    const cur = ytPlayer.getCurrentTime() || 0;
    const target = Math.max(0, Math.min(dur, cur + deltaSec));
    ytPlayer.seekTo(target, true);
  } catch (e) { /* player not ready */ }
}

function updateNowPlayingText(v) {
  const titleEl = document.querySelector(".np-title-c");
  const channelEl = document.querySelector(".np-channel-c");
  const thumbEl = document.querySelector(".np-thumb-big");
  if (titleEl) titleEl.textContent = v.title;
  if (channelEl) channelEl.textContent = v.channel || "";
  if (thumbEl) thumbEl.src = v.thumb || "";
  const curEl = document.getElementById("np-time-cur");
  const durEl = document.getElementById("np-time-dur");
  const bar = document.getElementById("np-seek");
  if (curEl) curEl.textContent = "0:00";
  if (durEl) durEl.textContent = "0:00";
  if (bar) bar.value = 0;
}

function syncNowPlaying() {
  const slot = document.getElementById("nowplaying-slot");
  if (!state.nowPlaying) {
    if (renderedNowPlayingId !== null) { slot.innerHTML = ""; renderedNowPlayingId = null; destroyPlayer(); }
    return;
  }
  const v = state.nowPlaying;
  if (renderedNowPlayingId === null) {
    // First video of the session: build the panel and player from scratch.
    renderedNowPlayingId = v.id;
    buildNowPlayingPanel(v);
    mountPlayer(v);
    return;
  }
  if (v.id === renderedNowPlayingId) return; // same track, nothing to do
  // Switching tracks: update the visible text/art in place and hand the new
  // video id to mountPlayer(), which reuses the existing iframe/player
  // instead of tearing the panel down (see mountPlayer for why that matters
  // for auto-advance to keep working).
  renderedNowPlayingId = v.id;
  updateNowPlayingText(v);
  mountPlayer(v);
}

/* ---------- root render ---------- */
function renderAll() {
  renderDirectUrlBox();
  renderError();
  syncNowPlaying();
}
renderAll();
</script>
